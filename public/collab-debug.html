<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Euclides Web — Collab Diagnostics</title>
<style>
  body { font-family: ui-monospace, monospace; background: #0f172a; color: #e2e8f0; padding: 24px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 18px; color: #7dd3fc; }
  .step { margin: 14px 0; padding: 12px; border-radius: 8px; background: #1e293b; border-left: 4px solid #334155; }
  .step.ok { border-color: #22c55e; }
  .step.fail { border-color: #ef4444; }
  .step.warn { border-color: #f59e0b; }
  .step h2 { font-size: 13px; margin: 0 0 6px; color: #94a3b8; }
  .step .result { font-size: 13px; white-space: pre-wrap; word-break: break-all; }
  .log { margin-top: 20px; padding: 12px; background: #020617; border-radius: 8px; font-size: 11px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
  button { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; margin: 4px; }
  button:hover { background: #2563eb; }
</style>
</head>
<body>
<h1>🔍 Euclides Web — Diagnóstico de Colaboração</h1>
<p style="font-size:12px;color:#94a3b8">Abra esta página no navegador onde o multiplayer falha. Ela roda o mesmo código do app e mostra exatamente onde trava.</p>
<div id="steps"></div>
<button onclick="location.reload()">Re-rodar diagnóstico</button>
<div class="log" id="log">log:
</div>
<script type="module">
  const steps = document.getElementById('steps');
  const logEl = document.getElementById('log');
  const logs = [];
  const addLog = (msg) => { logs.push(new Date().toISOString().slice(11, 23) + ' ' + msg); logEl.textContent = 'log:\n' + logs.join('\n'); };
  window.addEventListener('error', (e) => addLog('window error: ' + e.message));

  function step(name) {
    const div = document.createElement('div');
    div.className = 'step';
    div.innerHTML = `<h2>${name}</h2><div class="result">⏳ testing...</div>`;
    steps.appendChild(div);
    return {
      ok: (msg) => { div.className = 'step ok'; div.querySelector('.result').textContent = '✅ ' + msg; },
      fail: (msg) => { div.className = 'step fail'; div.querySelector('.result').textContent = '❌ ' + msg; },
      warn: (msg) => { div.className = 'step warn'; div.querySelector('.result').textContent = '⚠️ ' + msg; }
    };
  }

  // Step 1: env + session construction (same code path as the app)
  const s1 = step('1. App session can be constructed (env vars OK)');
  let session;
  try {
    const mod = await import('/services/collab.ts?diag=' + Date.now());
    session = new mod.CollabSession('diag-room-' + Math.random().toString(36).slice(2, 6), {
      onRemoteOps: () => {}, onRemoteFullState: () => {}, onRequestFullState: () => {},
      onPeersChanged: () => {}, onStatusChanged: (s) => addLog('status: ' + s)
    });
    s1.ok(`constructed — peer: ${session.info.peerName} (${session.info.peerId.slice(0, 8)})`);
  } catch (e) {
    s1.fail('CollabSession constructor threw: ' + e.message);
    throw e;
  }

  // Step 2: connect — subscribe status is the ground truth
  const s2 = step('2. Channel subscribe (the exact failing path)');
  const statuses = [];
  const s2done = { done: false };
  window.__diagSession = session;

  // monkey-patch to observe: connect() calls subscribe internally
  addLog('calling connect()...');
  session.connect();

  // Poll for status via presence events — the CollabSession exposes onStatusChanged to constructor callback
  // We passed a noop above; instead, watch channel state directly
  const checkInterval = setInterval(() => {
    if (window.__diagChannelState) return;
    // introspect
    try {
      // channel is private; use a second probe session that exposes it
    } catch {}
  }, 1000);

  // Simpler: create a second raw session with visible status callback
  const mod = await import('/services/collab.ts?diag2=' + Date.now());
  const s2statuses = [];
  const s2session = new mod.CollabSession(session ? 'diag-room-shared' : 'diag-room-2', {
    onRemoteOps: () => {}, onRemoteFullState: () => {}, onRequestFullState: () => {},
    onPeersChanged: (peers) => addLog('peers: ' + peers.length),
    onStatusChanged: (s) => {
      s2statuses.push(s);
      addLog('session2 status: ' + s);
      if (s === 'online') { s2.ok('ONLINE ✓ (statuses: ' + s2statuses.join(' → ') + ')'); s2done.done = true; }
      else if (s === 'offline') { if (!s2done.done) s2.fail('went OFFLINE (statuses: ' + s2statuses.join(' → ') + ') — connection dropped'); }
    }
  });
  s2session.connect();

  // Step 3: after 8s, check final status
  setTimeout(async () => {
    const s3 = step('3. Final verdict');
    if (s2statuses.includes('online')) {
      s3.ok('Collab works in THIS browser. If the app still fails here: (1) clear site data (F12 → Application → Clear), (2) hard reload, (3) check extensions blocking wss://*.supabase.co');
    } else {
      s3.fail('Never reached ONLINE. Statuses: ' + s2statuses.join(' → ') + '. Likely causes: extension blocking WebSocket to *.supabase.co, or network. Try incognito with extensions disabled.');
    }
  }, 8000);
</script>
</body>
</html>
